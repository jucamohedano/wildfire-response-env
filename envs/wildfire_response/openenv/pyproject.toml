[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-openenv"
version = "0.1.0"
description = "Typed OpenEnv client and single-session server for regional wildfire coordination"
requires-python = ">=3.12"
dependencies = ["wildfire-response-core==0.1.0", "openenv==0.7.0", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[tool.uv.sources]
wildfire-response-core = {path = "../core", editable = true}

[tool.setuptools.packages.find]
include = ["wildfire_openenv*"]
