[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-containment-score-v1"
version = "0.1.0"
description = "Standalone extended incident-day scoring and verification helpers"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
