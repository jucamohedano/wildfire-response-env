[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-containment-agent-v1"
version = "0.1.0"
description = "Experimental public tools for a containment incident-day episode"
requires-python = ">=3.12"
dependencies = ["wildfire-containment-v1==0.1.0", "wildfire-response-core==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
