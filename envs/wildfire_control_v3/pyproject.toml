[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-control-interface"
version = "0.3.0"
description = "Versioned control-centre interface for the Wildfire incident-day simulator"
requires-python = ">=3.12"
dependencies = ["wildfire-response-core==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["wildfire_control_v3*"]
