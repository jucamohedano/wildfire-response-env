[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-containment-v1"
version = "0.1.0"
description = "Experimental containment bookkeeping kernel"
requires-python = ">=3.12"

[project.optional-dependencies]
fire = ["wildfire-response-core==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
