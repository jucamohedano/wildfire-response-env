name: Ops v3 observation contract

on:
  pull_request:
    paths:
      - 'envs/wildfire_ops_v3/**'
      - 'envs/wildfire_response/openenv/**'
      - 'eval/evaluate_packaged_runtime.py'
      - 'eval/hub_runtime.py'
      - 'eval/incident_day_server.py'
      - 'tests/test_ops_v3_*.py'
      - 'tests/test_observation_version_entrypoints.py'
      - '.github/workflows/ops-v3-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install local packages and fixture test runtime
        run: python -m pip install -e envs/wildfire_response/core -e envs/wildfire_ops_v3 -e 'envs/wildfire_response/openenv[dev]' pytest==9.1.1 wheel
      - name: Verify feedback, causality, identity, recovery and installed wheel
        run: >-
          python -m pytest -q
          tests/test_ops_v3_feedback.py
          tests/test_ops_v3_population.py
          tests/test_ops_v3_population_integration.py
          tests/test_ops_v3_identity.py
          tests/test_ops_v3_runner.py
          tests/test_observation_version_entrypoints.py
          tests/test_evaluation_runtime.py
