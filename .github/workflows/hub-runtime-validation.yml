name: Downloaded runtime package

on:
  pull_request:
    paths:
      - '.github/workflows/hub-runtime-validation.yml'
      - 'eval/hub_runtime.py'
      - 'eval/build_spain_hub_dataset.py'
      - 'eval/validate_incident_day_runtime.py'
      - 'eval/incident_day_action_checks.py'
      - 'eval/incident_day_movement_checks.py'
      - 'eval/incident_day_policies.py'
      - 'tests/test_hub_runtime.py'
      - 'tests/test_build_spain_hub_dataset.py'
      - 'tests/test_incident_day_runtime_matrix.py'
      - 'tests/test_incident_day_action_checks.py'
      - 'tests/test_incident_day_movement_checks.py'
      - 'tests/test_incident_day_validation_policies.py'
      - 'data/incident_day_v2/plausibility/action-bounds-v1.json'
      - 'data/hub_runtime_v1/**'
      - 'envs/wildfire_response/core/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-runtime-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: envs/wildfire_response/core/src:.
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: python -m pip install --disable-pip-version-check -e envs/wildfire_response/core pytest==9.2.0 pyarrow==26.0.0
      - name: Verify package, source-pinning and replay guards offline
        run: >-
          python -m pytest tests/test_hub_runtime.py tests/test_build_spain_hub_dataset.py
          tests/test_incident_day_runtime_matrix.py tests/test_incident_day_action_checks.py
          tests/test_incident_day_movement_checks.py tests/test_incident_day_validation_policies.py -q
